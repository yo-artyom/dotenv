# Enable truecolor support
set-option -a terminal-overrides ",*256col*:RGB"
set-option -a terminal-overrides ",alacritty:RGB"

unbind C-b
set -g prefix C-a

# Increase history limit
set -g history-limit 50000

set -g allow-rename off

# Show a shortened OpenCode title and its response status.
set-window-option -g automatic-rename-format '#{?pane_in_mode,[tmux],#{?#{==:#{pane_current_command},opencode},#{?#{==:#{@opencode_status},busy},🌀,#{?#{==:#{@opencode_status},done},✅,}}#{=/35/…:#{s/^OC \| /🤖|/:pane_title}},#{pane_current_command}}}#{?pane_dead,[dead],}'

# Splits
unbind %
unbind '"'
bind c new-window -c "#{pane_current_path}"
bind h split-window -v -c '#{pane_current_path}'
bind v split-window -h -c "#{pane_current_path}"
bind C command-prompt -p "New session name:" "new-session -d -s '%1' \; switch-client -t '%1'"

# Pane switching with Alt+arrow
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Set vi mode
set-window-option -g mode-keys vi

# setup 'v' to begin selection as in Vim
bind-key -T copy-mode-vi 'v' send-keys -X begin-selection

# copy text with `y` in copy mode
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel

setw -g mouse on

set -g set-titles on
set -g set-titles-string "#T"

bind C-c run "tmux save-buffer - | pbcopy"

set-option -g status-position bottom

source-file ~/.tmux/current_theme.conf
