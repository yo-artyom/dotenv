general.import = ["~/.config/alacritty/currentTheme.toml"]

[env]
TERM = "alacritty-direct"

[font]
size = 16.0

[font.bold]
family = "DroidSansMono Nerd Font"
style = "Bold"

[font.bold_italic]
family = "DroidSansMono Nerd Font"
style = "Bold Italic"

[font.italic]
family = "DroidSansMono Nerd Font"
style = "Italic"

[font.normal]
family = "DroidSansMono Nerd Font"

[window]
opacity = 0.9
blur = true

[window.padding]
x = 10
y = 10

[keyboard]
bindings = [
    { key = "Return", mods = "Command", action = "ToggleFullscreen" },
    { key = "Left", mods = "Command", chars = "\u001bb" },
    { key = "Right", mods = "Command", chars = "\u001bf" }
]
