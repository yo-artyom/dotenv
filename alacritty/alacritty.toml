import = ["~/.config/alacritty/currentTheme.toml", "~/.config/dotenv/alacritty-platform.toml"]

[env]
TERM = "xterm-256color"

[font]
size = 16.0

[font.bold]
family = "DroidSansMono Nerd Font"
style = "Bold"

[font.bold_italic]
family = "DroidSansMono Nerd Font"
style = "Bold Italic"

[font.italic]
family = "DroidSansMono Nerd Font"
style = "Italic"

[font.normal]
family = "DroidSansMono Nerd Font"

[window]
opacity = 0.9

[window.padding]
x = 10
y = 10
